<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de exemplo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><img src="logo-icon.svg" alt="Logotipo"><div><h1>Derrete Ideias</h1><p>IMPRESSÃO 3D</p></div></div>
</header>
<nav id="filters" aria-label="Categorias"></nav>
<main><div class="grid" id="grid"></div></main>
<dialog id="detail"><div class="dlg" id="dlg"></div></dialog>
<footer>© 2026 Derrete Ideias · Para encomendas, contacte-nos por email ou instagram. <a id="mail" class="ig" aria-label="Email"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a> <a id="ig" class="ig" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a></footer>
<script>
const ALL="Todos";
let products=[], categories=[ALL];
let current=ALL;
function render(){
  document.getElementById("filters").innerHTML=categories.map(c=>
    `<button data-category="${c}" aria-pressed="${c===current}">${c}</button>`).join("");
  document.getElementById("grid").innerHTML=products
    .filter(p=>current===ALL||p.category===current).map(p=>`
    <article class="card" data-name="${p.name}" tabindex="0" role="button">
      <img class="thumb" src="${p.image}" alt="${p.name}" loading="lazy">      
      <div class="info">
        <h3>${p.name}</h3><small>${p.category}</small>
        <small>Ver detalhes →</small>
      </div>
    </article>`).join("");
}
const INSTAGRAM="https://www.instagram.com/derreteideias/"; // troca pelo teu perfil
const EMAIL="derreteideias@gmail.com"; // troca pelo teu email
document.getElementById("ig").href=INSTAGRAM;
document.getElementById("mail").href="mailto:"+EMAIL;
const dlg=document.getElementById("detail");
function open(n){
  const p=products.find(x=>x.name===n); if(!p)return;
  document.getElementById("dlg").innerHTML=`
    <img class="thumb" src="${p.image}" alt="${p.name}">
    <div class="body">
      <h2>${p.name}</h2><small>${p.category}</small>
      <p class="description">${p.description}</p>
      <a class="btn-instagram" href="${INSTAGRAM}" target="_blank" rel="noopener">Ver no Instagram</a>
      <a class="btn-email" href="mailto:${EMAIL}?subject=${encodeURIComponent("Pedido: "+p.name)}&body=${encodeURIComponent("Olá! Tenho interesse em: "+p.name)}">Enviar email</a>
      <button class="close" onclick="dlg.close()">Fechar</button>
    </div>`;
  dlg.showModal();
}
const gridEl=document.getElementById("grid");
gridEl.addEventListener("click",e=>{const c=e.target.closest(".card"); if(c)open(c.dataset.name);});
gridEl.addEventListener("keydown",e=>{if(e.key==="Enter"){const c=e.target.closest(".card"); if(c)open(c.dataset.name);}});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});
document.getElementById("filters").addEventListener("click",e=>{
  const c=e.target.dataset.category; if(c){current=c;render();}
});
fetch("products.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    products = data;
    categories = [ALL, ...new Set(data.map(p => p.category))];
    render();
  })
  .catch(() => {
    document.getElementById("grid").innerHTML =
      "<p>Não foi possível carregar os products.</p>";
  });
</script>
</body>
</html>
